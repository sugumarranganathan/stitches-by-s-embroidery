<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stitches by S — Embroidery Design Showcase</title>
<meta name="description" content="Stitches by S embroidery design client showcase.">
<style>
:root {
  --bg:#050505; --panel:#0c0c0c; --gold:#e7b84b; --text:#f6f2e9; --muted:#aaa;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0; min-height:100vh; color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 0%, rgba(231,184,75,.10), transparent 28%),
    radial-gradient(circle at 80% 10%, rgba(255,0,110,.07), transparent 24%),
    var(--bg);
}
header {
  padding:42px 20px 28px; text-align:center;
  animation:drop .8s ease both;
}
.brand {
  font-family:Georgia,serif; font-size:clamp(36px,6vw,72px);
  font-weight:700; letter-spacing:-2px;
  background:linear-gradient(90deg,#ff4d91,#a45cff,#e7b84b,#ff4d91);
  background-size:300% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shine 6s linear infinite;
}
.subtitle { color:var(--muted); margin:8px auto 0; max-width:720px; font-size:15px; }
.line { width:180px;height:2px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent); }
main { width:min(1200px,94vw); margin:auto; padding:12px 0 60px; }
.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
.card {
  background:linear-gradient(145deg,#111,#070707);
  border:1px solid rgba(231,184,75,.24);
  border-radius:18px; overflow:hidden;
  box-shadow:0 16px 50px rgba(0,0,0,.45);
  transform:translateY(20px); opacity:0;
  animation:rise .75s ease forwards;
}
.card:nth-child(1) {animation-delay:.05s} .card:nth-child(2) {animation-delay:.15s}
.card:nth-child(3) {animation-delay:.25s} .card:nth-child(4) {animation-delay:.35s}
.image-wrap { position:relative; background:#000; overflow:hidden; cursor:zoom-in; }
.image-wrap img {
  display:block; width:100%; height:auto;
  transition:transform .7s cubic-bezier(.2,.8,.2,1), filter .7s;
}
.card:hover img { transform:scale(1.025); filter:saturate(1.08) contrast(1.03); }
.thread-glow {
  position:absolute; inset:-30%; pointer-events:none;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 49%,transparent 54%);
  transform:translateX(-80%) rotate(8deg);
  animation:threadSweep 5.5s ease-in-out infinite;
  mix-blend-mode:screen;
}
.zoom-btn {
  position:absolute; right:14px; bottom:14px;
  border:1px solid rgba(255,255,255,.25); border-radius:999px;
  padding:9px 14px; background:rgba(0,0,0,.62); color:#fff;
  backdrop-filter:blur(8px); cursor:pointer; font-size:11px; letter-spacing:1px;
  opacity:.82;
}
.zoom-btn:hover { opacity:1; border-color:var(--gold); color:var(--gold); }
.card-footer { display:flex; justify-content:space-between; align-items:center; padding:13px 16px; }
.code { color:var(--gold); font-weight:700; letter-spacing:1px; }
.hint { color:#777; font-size:12px; }
footer { text-align:center; color:#666; padding:0 20px 30px; font-size:12px; }
#viewer {
  display:none; position:fixed; inset:0; z-index:99; background:rgba(0,0,0,.92);
  align-items:center; justify-content:center; padding:25px;
}
#viewer.open { display:flex; animation:fade .25s ease; }
#viewer img { max-width:96vw; max-height:92vh; object-fit:contain; border-radius:10px; box-shadow:0 20px 80px #000; }
.close {
  position:fixed; top:18px; right:22px; width:44px; height:44px; border-radius:50%;
  border:1px solid #555; background:#111; color:#fff; font-size:24px; cursor:pointer;
}
.viewer-label {
  position:fixed; left:22px; top:22px; color:var(--gold); font-weight:700;
  letter-spacing:1px; background:rgba(0,0,0,.55); padding:8px 12px; border-radius:10px;
}
@keyframes rise { to {transform:translateY(0);opacity:1} }
@keyframes drop { from {opacity:0;transform:translateY(-18px)} to {opacity:1;transform:none} }
@keyframes fade { from {opacity:0} to {opacity:1} }
@keyframes shine { 0%{background-position:0%} 100%{background-position:300%} }
@keyframes threadSweep { 0%,45%{transform:translateX(-80%) rotate(8deg)} 75%,100%{transform:translateX(80%) rotate(8deg)} }
@media(max-width:760px) {
  .grid {grid-template-columns:1fr;}
  header {padding-top:28px}
}
</style>
</head>
<body>
<header>
  <div class="brand">Stitches by S</div>
  <div class="line"></div>
  <p class="subtitle">Embroidery Design Client Showcase · 4 selected designs · High-resolution preview</p>
</header>

<main>
  <section class="grid">
    
      <article class="card" data-code="SBEMB-780">
        <div class="image-wrap">
          <img src="SBEMB-780.png" alt="Stitches by S embroidery design SBEMB-780" loading="lazy">
          <div class="thread-glow"></div>
          <button class="zoom-btn" type="button" aria-label="Zoom SBEMB-780" onclick="openViewer('SBEMB-780.png','SBEMB-780')">VIEW</button>
        </div>
        <div class="card-footer">
          <span class="code">SBEMB-780</span>
          <span class="hint">Click image to zoom</span>
        </div>
      </article>
    
      <article class="card" data-code="SBEMB-779">
        <div class="image-wrap">
          <img src="SBEMB-779.png" alt="Stitches by S embroidery design SBEMB-779" loading="lazy">
          <div class="thread-glow"></div>
          <button class="zoom-btn" type="button" aria-label="Zoom SBEMB-779" onclick="openViewer('SBEMB-779.png','SBEMB-779')">VIEW</button>
        </div>
        <div class="card-footer">
          <span class="code">SBEMB-779</span>
          <span class="hint">Click image to zoom</span>
        </div>
      </article>
    
      <article class="card" data-code="SBEMB-778">
        <div class="image-wrap">
          <img src="SBEMB-778.png" alt="Stitches by S embroidery design SBEMB-778" loading="lazy">
          <div class="thread-glow"></div>
          <button class="zoom-btn" type="button" aria-label="Zoom SBEMB-778" onclick="openViewer('SBEMB-778.png','SBEMB-778')">VIEW</button>
        </div>
        <div class="card-footer">
          <span class="code">SBEMB-778</span>
          <span class="hint">Click image to zoom</span>
        </div>
      </article>
    
      <article class="card" data-code="SBEMB-777">
        <div class="image-wrap">
          <img src="SBEMB-777.png" alt="Stitches by S embroidery design SBEMB-777" loading="lazy">
          <div class="thread-glow"></div>
          <button class="zoom-btn" type="button" aria-label="Zoom SBEMB-777" onclick="openViewer('SBEMB-777.png','SBEMB-777')">VIEW</button>
        </div>
        <div class="card-footer">
          <span class="code">SBEMB-777</span>
          <span class="hint">Click image to zoom</span>
        </div>
      </article>
    
  </section>
</main>

<footer>© Stitches by S · Client Preview</footer>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Image viewer" onclick="closeViewer(event)">
  <div class="viewer-label" id="viewerLabel"></div>
  <button class="close" type="button" aria-label="Close" onclick="closeViewer()">×</button>
  <img id="viewerImg" src="" alt="">
</div>

<script>
function openViewer(src, code) {
  document.getElementById('viewerImg').src = src;
  document.getElementById('viewerImg').alt = 'Embroidery design ' + code;
  document.getElementById('viewerLabel').textContent = code;
  document.getElementById('viewer').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeViewer(e) {
  if (e && e.target && e.target.id !== 'viewer' && !e.target.classList.contains('close')) return;
  document.getElementById('viewer').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeViewer();
});
</script>
</body>
</html>
